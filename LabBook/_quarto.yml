project:
  type: book
  output-dir: ../docs

bookdown::gitbook:
   
book:
  title: "Lab Book"
  author: "Brad Day"
  date: "2025/05/19"
  downloads:
    - pdf
  chapters:
    - index.qmd
    - 1_IronKalphaReviewSummary.qmd
    - 2_InitialGradus.qmd
    - 3_ParamSpace.qmd
    - 4_Fitting.qmd
    - 5_FittingData.qmd
    - 6_TableModel.qmd
    - 7_XRISMReduction.qmd
    - 8_DeformConstraints.qmd
    - references.qmd

bibliography: references.bib
csl: american-physical-society-et-al.csl
lightbox: true

format:
  html:
    code-fold: true
    html-math-method: mathjax
    include-in-header:
      - text: |
          <script>
          window.MathJax = {
            loader: {
              load: ['[tex]/boldsymbol', '[tex]/physics']
            },
            tex: {
              packages: {
                '[+]': ['boldsymbol', 'physics']
              }
            }
          };
          </script>
  pdf:
    include-in-header:
      - text: |
          \usepackage{amsmath, gensymb, physics}
          \usepackage[margin=15mm]{geometry}

jupyter: python3

theme:
    light: flatly
    dark: darkly
